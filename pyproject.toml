[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sca-physics"
version = "0.1.8rc1"
description = "Persist validated downstream physics in SCA product definition metadata"
readme = "README.zh-CN.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["simplecadapi>=2.2.5,<2.2.6"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.23,<5"]

[project.scripts]
sca-physics = "sca_physics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sca_physics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
